services:
  rjsheetal:
    build:
      context: .
    image: ghcr.io/vishalgojha/rjsheetal:main
    container_name: rjsheetal
    restart: unless-stopped
    ports:
      # host 8080 -> container 8080 (Coolify/Traefik proxies to this)
      - "8080:8080"
    environment:
      PORT: "8080"
      RJSHEETAL_DATA: /data
      RJSHEETAL_LISTENER_NAME: ${RJSHEETAL_LISTENER_NAME:-Sheetal}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      RJSHEETAL_TOKEN: ${RJSHEETAL_TOKEN:-}
      RJSHEETAL_STATION: ${RJSHEETAL_STATION:-Sheetal FM}
      RJSHEETAL_TAGLINE: ${RJSHEETAL_TAGLINE:-Sheetal's live radio station}
      RJSHEETAL_MAX_QUEUE: ${RJSHEETAL_MAX_QUEUE:-8}
      RJSHEETAL_DEFAULT_TRACK_URI: ${RJSHEETAL_DEFAULT_TRACK_URI:-spotify:track:3dcSec3fFteTR6QlQ194aI}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-7qBNUtXRGP0jPi0H4r8k}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3_conversational}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-agent_8401m2cyznemf10tav3hh90nqya1}
    volumes:
      - rjsheetal-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  rjsheetal-data:
