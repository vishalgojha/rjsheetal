<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>RJ Sheetal · Live Radio</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0e1a;
    --panel: #121627;
    --panel-2: #181d31;
    --line: rgba(255,255,255,.08);
    --text: #f2f4ff;
    --dim: #8b93b4;
    --accent: #2dd4bf;      /* fresh teal - "Sheetal" = cool */
    --accent-2: #6366f1;
    --hot: #f59e0b;
    --live: #34d399;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    background:
      radial-gradient(1100px 560px at 50% -12%, rgba(99,102,241,.20), transparent 60%),
      radial-gradient(700px 460px at 95% 108%, rgba(45,212,191,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 22px 18px 120px; }

  /* ---- header ---- */
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(99,102,241,.35); }
  .logo svg { width: 22px; height: 22px; fill: #0b0e1a; }
  .brand b { font-size: 18px; letter-spacing: .4px; }
  .brand small { display: block; font-size: 10px; color: var(--dim); letter-spacing: 2.5px; font-weight: 600; }

  .pill { display: flex; align-items: center; gap: 7px; padding: 6px 12px;
    border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--dim); }
  .pill.live { color: var(--live); border-color: rgba(52,211,153,.35);
    background: rgba(52,211,153,.08); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  .pill.live .dot { animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---- player card ---- */
  .card {
    margin-top: 22px; padding: 26px 20px 22px; text-align: center;
    border-radius: 26px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
    position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(420px 180px at 50% -10%, rgba(45,212,191,.16), transparent 70%); }

  .mic {
    position: relative; width: 132px; height: 132px; margin: 4px auto 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #e8ecff, #3f4bd0 46%, #232a7a 72%, #141a52);
    box-shadow: 0 14px 34px rgba(70,80,200,.4), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -8px 18px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .5s ease;
  }
  .mic.spin { animation: floaty 5s ease-in-out infinite; }
  @keyframes floaty { 50% { transform: translateY(-7px) rotate(2deg); } }
  .mic svg { width: 62px; height: 62px; fill: #fff; filter: drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
  .mic .ring { position: absolute; inset: -10px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,.18);
    animation: rr 14s linear infinite; }
  @keyframes rr { to { transform: rotate(360deg); } }
  .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 22px; margin-top: 2px; width: 26px; }
  .eq i { width: 4px; border-radius: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(1){ height: 10px; } .eq i:nth-child(2){ height: 20px; animation-delay: .18s; }
  .eq i:nth-child(3){ height: 14px; animation-delay: .36s; } .eq i:nth-child(4){ height: 18px; animation-delay: .5s; }
  @keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  h1 { font-size: 34px; letter-spacing: 1px; font-weight: 800;
    background: linear-gradient(90deg, #7ff3e3, #64a8ff 55%, #a78bfa);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tag { color: var(--dim); font-size: 13px; margin-top: 4px; letter-spacing: .3px; }

  .now { margin-top: 16px; min-height: 44px; }
  .now .lbl { font-size: 10px; letter-spacing: 2.5px; color: var(--dim); text-transform: uppercase; }
  #title { font-size: 18px; font-weight: 650; margin-top: 6px; line-height: 1.35;
    min-height: 24px; transition: opacity .3s; }
  #title.fade { opacity: 0; }

  .play {
    width: 86px; height: 86px; margin: 18px auto 6px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 32% 28%, #38e0c9, #26b39d 52%, #17907f);
    color: #06231f; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 34px rgba(45,212,191,.4), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -6px 12px rgba(0,0,0,.25);
    transition: transform .12s, box-shadow .12s;
  }
  .play:active { transform: scale(.93); }
  .play svg { width: 32px; height: 32px; fill: #06231f; }
  .play .pause { display: none; }
  .play.playing .play-i { display: none; }
  .play.playing .pause { display: block; }
  .playhint { font-size: 11px; color: var(--dim); margin-top: 4px; }

  .seek { width: 100%; height: 5px; margin-top: 14px; border-radius: 3px;
    background: rgba(255,255,255,.1); overflow: hidden; cursor: pointer; }
  .seek .fill { height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  .stats { display: flex; justify-content: center; gap: 22px; margin-top: 16px;
    color: var(--dim); font-size: 12px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ---- section title ---- */
  .sec { display: flex; align-items: center; gap: 10px; margin: 26px 2px 12px; }
  .sec h2 { font-size: 15px; letter-spacing: .5px; }
  .sec h2 span { color: var(--accent); }
  .sec .cnt { margin-left: auto; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; color: var(--dim); background: rgba(255,255,255,.05); border: 1px solid var(--line); }

  /* ---- request search ---- */
  .searchbox { position: relative; }
  .searchbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--dim); fill: none; stroke-width: 2; }
  #q {
    width: 100%; padding: 13px 14px 13px 40px; font-size: 15px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #q:focus { border-color: rgba(45,212,191,.55);
    box-shadow: 0 0 0 3px rgba(45,212,191,.12); }
  #q::placeholder { color: var(--dim); }

  .results { margin-top: 10px; display: grid; gap: 8px; }
  .res {
    display: flex; align-items: center; gap: 12px; padding: 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .res img { width: 46px; height: 46px; border-radius: 9px; object-fit: cover;
    background: var(--panel-2); flex: none; }
  .res .info { min-width: 0; flex: 1; }
  .res .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .who { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .res button {
    flex: none; padding: 8px 13px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121c;
    font-size: 12px; font-weight: 700; transition: transform .1s;
  }
  .res button:active { transform: scale(.93); }
  .res button.done { opacity: .55; cursor: default; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 0; }

  /* ---- queue board ---- */
  #queue { display: grid; gap: 8px; }
  .qitem {
    display: flex; align-items: center; gap: 12px; padding: 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    position: relative; overflow: hidden;
  }
  .qitem .idx { width: 24px; text-align: center; font-size: 12px; color: var(--dim);
    font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  .qitem img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover;
    background: var(--panel-2); flex: none; }
  .qitem .info { min-width: 0; flex: 1; }
  .qitem .name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qitem .who { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qitem.claimed { border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.06); }
  .qitem .hotdot { width: 7px; height: 7px; border-radius: 50%; background: var(--hot);
    box-shadow: 0 0 8px var(--hot); flex: none; display: none; }
  .qitem.claimed .hotdot { display: block; }

  .note { text-align: center; font-size: 11.5px; color: var(--dim); margin-top: 16px; line-height: 1.7; }
  .note code { color: var(--accent); }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    z-index: 99; padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    box-shadow: 0 12px 34px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: rgba(45,212,191,.5); }
  #toast.bad { border-color: rgba(251,113,133,.5); }

  .footer { text-align: center; margin-top: 30px; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v3a1 1 0 0 0 1 1h2V11H4a7 7 0 0 1 14 0h-2v5h2a1 1 0 0 0 1-1v-3a9 9 0 0 0-9-9zM6 14v3m12-3v3"/></svg>
      </div>
      <div>
        <b>RJ Sheetal</b>
        <small>LIVE RADIO</small>
      </div>
    </div>
    <div class="pill" id="air"><span class="dot"></span><span id="airTxt">OFF AIR</span></div>
  </header>

  <section class="card">
    <div class="mic" id="mic">
      <svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm7-4h-2a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21H8v2h8v-2h-3v-3.1A7 7 0 0 0 19 11z"/></svg>
      <div class="ring"></div>
    </div>
    <h1>RJ Sheetal</h1>
    <div class="tag" id="tagline">your favourite radio jockey</div>

    <div class="now">
      <div class="lbl" id="nowLbl">now playing</div>
      <div id="title">…</div>
    </div>

    <button class="play" id="play" aria-label="play / pause">
      <svg class="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="playhint">tap to listen live</div>

    <div class="seek" id="seek"><div class="fill" id="fill"></div></div>

    <div class="stats">
      <span>listeners <b id="listeners">0</b></span>
      <span>queue <b id="qcount">0</b></span>
      <span>on air <b id="since">–</b></span>
    </div>
  </section>

  <div class="sec">
    <h2>request a <span>song</span></h2>
    <div class="cnt" id="qcap"></div>
  </div>

  <div class="searchbox">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="search any song on spotify…">
  </div>
  <div class="results" id="results"></div>

  <div class="sec">
    <h2>coming up on <span>RJ Sheetal</span></h2>
    <div class="cnt" id="qcap2"></div>
  </div>
  <div id="queue"></div>

  <div class="note">
    Every request goes straight to the airwaves.
    <br>Made with <code>Spotify</code> · <code>rj.vishalojha.me</code>
  </div>

  <div class="footer">© RJ Sheetal · all requests are love</div>
</div>

<div id="toast"></div>
<audio id="audio" preload="none"></audio>

<script>
var audio = document.getElementById('audio');
var btn = document.getElementById('play');
var titleEl = document.getElementById('title');
var airEl = document.getElementById('air');
var airTxt = document.getElementById('airTxt');
var pill = document.getElementById('pill');
var fill = document.getElementById('fill');
var seek = document.getElementById('seek');
var listenersEl = document.getElementById('listeners');
var qcountEl = document.getElementById('qcount');
var sinceEl = document.getElementById('since');
var resultsEl = document.getElementById('results');
var queueEl = document.getElementById('queue');
var startTs = null, lastTitle = '';
var debounce = null;

audio.src = '/api/stream';

function toast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || 'ok');
  clearTimeout(toast._id);
  toast._id = setTimeout(function(){ t.className = ''; }, 2600);
}

btn.addEventListener('click', function(){
  if (audio.paused) audio.play().catch(function(){ toast('press play to start', 'bad'); });
  else audio.pause();
});
audio.addEventListener('play', function(){ btn.classList.add('playing'); });
audio.addEventListener('pause', function(){ btn.classList.remove('playing'); });
audio.addEventListener('error', function(){
  btn.classList.remove('playing');
  if (audio.src) toast('stream offline — try again soon', 'bad');
});
audio.addEventListener('timeupdate', function(){
  if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
});
seek.addEventListener('click', function(e){
  var r = seek.getBoundingClientRect();
  if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
});

function fmtDur(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ':' + ((s % 60) + '').padStart(2, '0');
}
function fmtUptime(s) {
  s = Math.max(0, s | 0);
  var h = s / 3600 | 0, m = (s % 3600) / 60 | 0;
  return (h ? h + 'h ' : '') + m + 'm';
}

function setOnAir(on) {
  airEl.classList.toggle('live', on);
  airTxt.textContent = on ? 'LIVE' : 'OFF AIR';
  document.getElementById('nowLbl').textContent = on ? 'now playing' : 'show starts soon';
  if (!on && !lastTitle) titleEl.textContent = 'sitting with you until the show starts';
}

setInterval(function(){
  fetch('/api/status').then(function(r){ return r.json(); }).then(function(j){
    setOnAir(j.on_air);
    if (j.title && j.title !== lastTitle) {
      lastTitle = j.title;
      titleEl.classList.add('fade');
      setTimeout(function(){
        titleEl.textContent = j.title;
        titleEl.classList.remove('fade');
      }, 300);
    }
    listenersEl.textContent = j.listeners;
    qcountEl.textContent = j.queue_len;
    sinceEl.textContent = j.on_air ? fmtUptime(j.uptime_s) : '–';
    document.getElementById('qcap').textContent = j.queue_len + ' in queue';
  }).catch(function(){});
}, 3000);

var lastQueue = [];
function renderQueue(queue) {
  if (JSON.stringify(queue) === lastQueue) return;
  lastQueue = JSON.stringify(queue);
  var items = queue.filter(function(r){ return r.status !== 'done'; });
  queueEl.innerHTML = items.length ? items.map(function(r, i){
    return '<div class="qitem' + (r.status === 'claimed' ? ' claimed' : '') + '">' +
      '<div class="idx">' + (r.status === 'claimed' ? '' : (i + 1)) + '</div>' +
      (r.art ? '<img src="' + r.art + '" alt="">' : '') +
      '<div class="info"><div class="name">' + esc(r.name) + '</div>' +
      '<div class="who">' + esc(r.artist) + (r.status === 'claimed' ? ' · ON AIR NOW' : '') + '</div></div>' +
      '<div class="hotdot"></div></div>';
  }).join('') : '<div class="empty">no requests yet — be the first to put one on the air</div>';
  document.getElementById('qcap2').textContent = items.length || '';
}
setInterval(function(){
  fetch('/api/queue').then(function(r){ return r.json(); }).then(function(j){
    renderQueue(j.queue || []);
  }).catch(function(){});
}, 3000);

function esc(s) {
  return (s || '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function search(q) {
  fetch('/api/search?q=' + encodeURIComponent(q)).then(function(r){ return r.json(); })
    .then(function(j){
      var rs = j.results || [];
      if (!q) { resultsEl.innerHTML = ''; return; }
      resultsEl.innerHTML = rs.length ? rs.map(function(t){
        return '<div class="res">' +
          (t.art ? '<img src="' + t.art + '" alt="" loading="lazy">' : '') +
          '<div class="info"><div class="name">' + esc(t.name) + '</div>' +
          '<div class="who">' + esc(t.artist) + ' · ' + fmtDur(t.dur_ms) + '</div></div>' +
          '<button data-uri="' + t.uri + '" data-name="' + esc(t.name) + '">request</button></div>';
      }).join('') : '<div class="empty">nothing found — try a different song</div>';
      resultsEl.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          requestTrack(b.getAttribute('data-uri'));
        });
      });
    }).catch(function(){});
}

document.getElementById('q').addEventListener('input', function(){
  var q = this.value.trim();
  clearTimeout(debounce);
  debounce = setTimeout(function(){
    if (q.length >= 2) search(q); else resultsEl.innerHTML = '';
  }, 380);
});

function requestTrack(uri) {
  fetch('/api/request', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uri: uri })
  }).then(function(r){
    return r.json().then(function(j){ return { ok: r.ok, j: j }; });
  }).then(function(res){
    if (res.ok) {
      toast('in the queue! coming up on RJ Sheetal');
      document.getElementById('q').value = '';
      resultsEl.innerHTML = '';
      renderQueue([]);
    } else {
      toast(res.j.error || 'could not request', 'bad');
    }
  }).catch(function(){ toast('could not request', 'bad'); });
}

document.addEventListener('pointerdown', function(){ if (audio.paused) audio.play().catch(function(){}); }, { once: false });
</script>
</body>
</html>
